[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-buddy"
version = "0.25.0"
description = "A Session Management MCP Server for Claude Code"
readme = "README.md"
authors = [{name = "Les Leslie", email = "les@wedgwoodwebworks.com"}]
requires-python = ">=3.14"
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiofiles>=25.1.0",
    "fastmcp>=3.4.0,<4",
    "hatchling>=1.30.1",
    "numpy>=2.4.6",
    # onnxruntime, transformers removed — session-buddy uses HTTP embedding providers
    # (llama-server → Ollama → graceful degradation) for vector embeddings.
    # This removes a transitive dependency conflict across the Bodai ecosystem.
    "pydantic>=2.13.4",
    "python-ulid>=2.0.0",
    "duckdb>=1.5.3",
    "httpx>=0.28.1",
    # DuckDB's Python client requires pytz to read TIMESTAMP WITH TIME ZONE
    # columns. session-buddy's schema (conversations_v2, session_windows,
    # cross_repo_work_v2, etc.) uses TIMESTAMP WITH TIME ZONE extensively,
    # so this must be a runtime dependency, not optional.
    "pytz>=2024.1",
    "rich>=15.0.0",
    "structlog>=25.5.0",
    "typer>=0.26.6",
    "crackerjack>=0.70.0",
    "prometheus-client>=0.25.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "websockets>=16.0",
    "mcp-common>=0.19.0",
    "dhara>=0.9.7",
    # Wave 3 (W3): oneiric listed as a *direct* dependency even though
    # mcp-common transitively pulls it in. Action kits (``SecuritySignatureAction``,
    # ``DataSanitizeAction``, etc.) are part of oneiric's public API surface,
    # not mcp-common's, so consumers should import from oneiric directly.
    "oneiric>=0.20",
]

[project.scripts]
session-buddy = "session_buddy.__main__:main"

[project.entry-points."bodai.apps"]
session-buddy = "session_buddy.cli:app"

[project.license]
text = "BSD-3-CLAUSE"

[project.urls]
documentation = "https://github.com/lesleslie/session-buddy"
homepage = "https://github.com/lesleslie/session-buddy"
repository = "https://github.com/lesleslie/session-buddy"

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    "tests/",
    "test_*.py",
    "*_test.py",
]

[tool.ruff.lint]
extend-select = [
    "BLE001",
    "C901",
    "F",
    "I",
    "UP",
]
ignore = [
    "E402",
    "F821",
]
fixable = [
    "ALL",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

# B008 allowed in typer default args (e.g. `x: int = typer.Option(...)`).
# Mirrors the pattern used across the Bodai ecosystem so we can pass
# typer.Option defaults idiomatically without per-call noqa comments.
[tool.ruff.lint.per-file-ignores]
"session_buddy/**/*cli*.py" = ["B008"]
"session_buddy/cli/**/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 600
testpaths = [
    "tests",
]
addopts = [
    "--cov=session_buddy",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=json",
    "--cov-fail-under=2.4534729990847146",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "-p", "no:randomly",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "security: Security-focused tests",
    "performance: Performance and load tests",
    "slow: Slow tests (>2s)",
    "benchmark: Benchmark tests (deferred)",
    "smoke: Quick smoke tests",
    "regression: Regression tests",
    "mutation: Mutation testing",
    "chaos: Chaos engineering test",
    "ai_generated: AI-generated test",
    "breakthrough: Breakthrough frontier test",
    "parallel_safe: Safe for parallel execution",
    "database: Database test",
    "external: External services required",
    "no_leaks: Asyncio task leak detection",
    "property: Property-based test",
    "functional: Functional tests",
    "async_test: mark test as requiring async event loop",
    "db_test: mark test as requiring database",
    "embedding_test: mark test as requiring embeddings",
    "mcp: mark test as MCP-related",
    "mcp_test: mark test is MCP server test",
]

[tool.coverage.run]
branch = true
parallel = true
concurrency = [
    "multiprocessing",
]
source = [
    "session_buddy",
]
data_file = ".coverage"
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/__init__.py",
    "*/_version.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "pass",
    "raise ImportError",
    "except ImportError",
]

[tool.vulture]
min_confidence = 80
paths = ["session_buddy"]
exclude = ["tests/", "*/__pycache__/*"]
ignore_names = []
make_whitelist = false
sort_by_size = true

[tool.pyright]
include = [
    "session_buddy",
]
exclude = [
    "tests/*",
    "scratch",
    ".venv",
    "build",
    "dist",
]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.bandit]
target = [
    "session_buddy",
]
skips = [
    "B101",
    "B110",
    "B112",
    "B404",
    "B603",
    "B607",
]
exclude_dirs = [
    "tests/",
]

[tool.ty]
src = { include = ["session_buddy/**/*.py"] }

[tool.ty.rules]
# Same `# ty: ignore` directive can report UNUSED in interactive shell but
# suppress a real error under crackerjack (stricter ty config). Treat
# unused-ignore as informational only so directives work in both contexts.
unused-ignore-comment = "ignore"

[tool.codespell]
quiet-level = 3
ignore-words-list = "crate,uptodate,nd,nin"

[tool.creosote]
paths = [
    "session_buddy",
]
deps-file = "pyproject.toml"
exclude-deps = [
    # Optional/missing imports - all use try/except ImportError patterns
    "aiofiles",     # team_knowledge uses importlib find_spec, not direct import
    "rich",         # quality_engine.py only uses in f-string for output formatting
    # Transitive dependency pins — declared in pyproject.toml so the
    # runtime contract is explicit, but not imported directly by
    # session-buddy source code. DuckDB's Python client requires pytz
    # at runtime to read TIMESTAMP WITH TIME ZONE columns used by
    # session-buddy's reflection tables (conversations_v2,
    # session_windows, cross_repo_work_v2).
    "pytz",
    # Only keep hatchling - the only dependency from pyproject.toml that's in exclude-deps
    "hatchling",
]

[tool.refurb]
enable_all = false
quiet = true
python_version = "3.14"
ignore = [
    "FURB184",
    "FURB120",
]

[tool.complexipy]
default_pattern = "**/*.py"
exclude_patterns = [
    "**/tests/**",
    "**/test_*.py",
]
max_complexity = 15

# PEP 735 dependency-groups (replaces [project.optional-dependencies]).
# Install with: uv sync --group dev --group storage --group llm --group telemetry --group treesitter
[dependency-groups]
dev = [
    "crackerjack>=0.70.0",
    "deadcode>=2.4.1",
    "factory-boy>=3.3.3",
    "faker>=40.20.0",
    "hypothesis>=6.0",
]

# mcp-common sub-features (formerly `mcp-common[treesitter,llm]` extras).
# Now declared here per the Bodai PEP 735 standard.
treesitter = [
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-go>=0.25.0",
]
llm-providers = [
    "openai>=2.41.0",
]

# Session-buddy feature groups. All imports in these areas are behind
# try/except ImportError guards; install the group to enable the feature.
storage = [
    "redis>=5.0.0",
    "boto3>=1.34.0",
]
llm = [
    "anthropic>=0.39.0",
    "tiktoken>=0.7.0",
]
telemetry = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[tool.uv.sources]


[tool.crackerjack]
# Exclude directories and files from link checking
exclude_patterns = [
    ".venv/**",
    "node_modules/**",
    "build/**",
    "dist/**",
    ".git/**",
    "docs/ZUBAN_FIX_SUMMARY.md",
    ".claude/commands/**",
    "coverage_report/**",
    "htmlcov/**",
]

# AI agent mode configuration (default: true)
ai_agent_mode = true
